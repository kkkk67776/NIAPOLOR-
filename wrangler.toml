FIREBASE_PROJECT_ID = "gen-lang-client-0499444627"
FIREBASE_FIRESTORE_DATABASE_ID = "ai-studio-echoxstore-9e1d54e8-7960-44b2-951a-524166c61a13"

# Configure in Cloudflare Pages Dashboard -> Settings -> Variables and Secrets (Encrypted):
